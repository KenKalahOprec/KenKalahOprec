<svg width="620" height="135" viewBox="0 0 620 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="p4_shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Drop shadow base polygon -->
  <polygon points="12,12 612,6 598,126 6,132" fill="#000000" />

  <!-- Outer Yellow Shell -->
  <polygon points="10,10 608,4 595,122 4,128" fill="#FFD500" stroke="#000000" stroke-width="4" />

  <!-- Rainbow Accent Lines Top Right -->
  <line x1="160" y1="14" x2="585" y2="9" stroke="#FF3D00" stroke-width="3" />
  <line x1="160" y1="19" x2="585" y2="14" stroke="#00E676" stroke-width="2" />
  <line x1="160" y1="23" x2="585" y2="18" stroke="#00E5FF" stroke-width="2" />

  <!-- Left Cassette / TV Screen Module -->
  <polygon points="16,14 140,12 135,118 12,122" fill="#121214" stroke="#000000" stroke-width="2" />

  <!-- P4 Star in TV Module -->
  <polygon points="76,24 79,33 88,33 81,39 84,48 76,42 68,48 71,39 64,33 73,33" fill="#FFD500" />

  <!-- Animated Sound Waveform Bars inside Left Box -->
  <g fill="#FFD500">
    <!-- Bar 1 -->
    <rect x="36" y="65" width="6" height="35" rx="3">
      <animate attributeName="height" values="35;15;40;20;35" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="65;85;60;80;65" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 2 -->
    <rect x="48" y="55" width="6" height="45" rx="3">
      <animate attributeName="height" values="45;20;50;15;45" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="55;80;50;85;55" dur="0.9s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 3 -->
    <rect x="60" y="70" width="6" height="30" rx="3">
      <animate attributeName="height" values="30;48;18;45;30" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="70;52;82;55;70" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 4 -->
    <rect x="72" y="60" width="6" height="40" rx="3">
      <animate attributeName="height" values="40;18;46;22;40" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="60;82;54;78;60" dur="0.8s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 5 -->
    <rect x="84" y="68" width="6" height="32" rx="3">
      <animate attributeName="height" values="32;50;20;42;32" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="68;50;80;58;68" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 6 -->
    <rect x="96" y="58" width="6" height="42" rx="3">
      <animate attributeName="height" values="42;22;48;16;42" dur="1.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="58;78;52;84;58" dur="1.0s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 7 -->
    <rect x="108" y="66" width="6" height="34" rx="3">
      <animate attributeName="height" values="34;16;38;24;34" dur="1.15s" repeatCount="indefinite" />
      <animate attributeName="y" values="66;84;62;76;66" dur="1.15s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Track Header Label -->
  <text x="160" y="42" fill="#121214" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-style="italic" letter-spacing="2">
    📺 MIDNIGHT CHANNEL JUKEBOX // TRACK #04
  </text>

  <!-- Song Title -->
  <text x="160" y="74" fill="#000000" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" font-style="italic" letter-spacing="2">
    HEAVEN
  </text>

  <!-- Artist & Composer -->
  <text x="300" y="72" fill="#2A2A30" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="700">
    Shihoko Hirata • Composed by Shoji Meguro
  </text>

  <!-- Progress Bar Track -->
  <rect x="160" y="86" width="280" height="7" rx="3.5" fill="#121214" opacity="0.25" />
  <!-- Progress Filled -->
  <rect x="160" y="86" width="135" height="7" rx="3.5" fill="#121214" />
  <!-- Progress Pin -->
  <circle cx="295" cy="89.5" r="6" fill="#FF3D00" stroke="#121214" stroke-width="2" />

  <!-- Time Stamps -->
  <text x="160" y="107" fill="#121214" font-family="'Courier New', monospace" font-size="11" font-weight="bold">
    01:24 / 03:00
  </text>

  <!-- Play Button Action Right Badge -->
  <g transform="translate(460, 48)">
    <polygon points="0,0 125,0 120,52 0,52" fill="#121214" stroke="#000000" stroke-width="2" />
    <!-- Yellow Play Symbol -->
    <polygon points="20,17 38,26 20,35" fill="#FFD500" />
    <text x="45" y="25" fill="#FFD500" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-style="italic" letter-spacing="1">PLAY</text>
    <text x="45" y="41" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-style="italic" letter-spacing="1">AUDIO BGM</text>
  </g>
</svg>

