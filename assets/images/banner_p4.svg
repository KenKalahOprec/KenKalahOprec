<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Houndstooth Pattern -->
    <pattern id="p4_houndstooth" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0 H20 V20 H0 Z" fill="#141416" />
      <path d="M20 20 H40 V40 H20 Z" fill="#141416" />
      <path d="M20 0 L40 20 H30 L20 10 L10 20 H0 L20 0 Z" fill="#222226" />
      <path d="M0 20 L20 40 H10 L0 30 Z" fill="#222226" />
    </pattern>

    <!-- Halftone Dots Pattern -->
    <pattern id="p4_dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.5" fill="#FFE500" opacity="0.18" />
    </pattern>

    <linearGradient id="p4_gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="60%" stop-color="#FFD500" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <linearGradient id="rainbow_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="30%" stop-color="#FFD600" />
      <stop offset="70%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <filter id="p4_shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="5" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Dark Base Background with Houndstooth -->
  <rect width="1200" height="360" fill="#121214" />
  <rect width="1200" height="360" fill="url(#p4_houndstooth)" />

  <!-- Big Persona 4 Yellow Dynamic Slash -->
  <polygon points="340,0 1200,0 1200,360 480,360" fill="url(#p4_gold_grad)" />
  <polygon points="340,0 1200,0 1200,360 480,360" fill="url(#p4_dots)" />

  <!-- P4 Rainbow Accent Velocity Stripes -->
  <polygon points="318,0 338,0 478,360 458,360" fill="#FF3D00" />
  <polygon points="298,0 318,0 458,360 438,360" fill="#FF9100" />
  <polygon points="278,0 298,0 438,360 418,360" fill="#00E676" />
  <polygon points="258,0 278,0 418,360 398,360" fill="#00E5FF" />

  <!-- Retro TV Frame on the Left -->
  <g transform="translate(60, 45)">
    <!-- TV Antenna -->
    <line x1="80" y1="20" x2="35" y2="-25" stroke="#FFE500" stroke-width="4" stroke-linecap="round" />
    <circle cx="35" cy="-25" r="5" fill="#FFE500" />
    <line x1="120" y1="20" x2="165" y2="-25" stroke="#FFE500" stroke-width="4" stroke-linecap="round" />
    <circle cx="165" cy="-25" r="5" fill="#FFE500" />

    <!-- TV Body Outer -->
    <rect x="0" y="18" width="200" height="150" rx="22" fill="#1C1C20" stroke="#FFE500" stroke-width="5" filter="url(#p4_shadow)" />
    <!-- TV Screen Inner -->
    <rect x="14" y="32" width="134" height="122" rx="14" fill="#0A0A0C" stroke="#33333A" stroke-width="2" />
    <!-- TV Scanlines in Screen -->
    <line x1="14" y1="52" x2="148" y2="52" stroke="#FFE500" stroke-width="1" opacity="0.3" />
    <line x1="14" y1="72" x2="148" y2="72" stroke="#FFE500" stroke-width="1" opacity="0.3" />
    <line x1="14" y1="92" x2="148" y2="92" stroke="#FFE500" stroke-width="1" opacity="0.3" />
    <line x1="14" y1="112" x2="148" y2="112" stroke="#FFE500" stroke-width="1" opacity="0.3" />
    <line x1="14" y1="132" x2="148" y2="132" stroke="#FFE500" stroke-width="1" opacity="0.3" />

    <!-- Text inside TV: Midnight Channel -->
    <text x="81" y="85" fill="#FFE500" font-family="'Impact', 'Arial Black', sans-serif" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="2">MIDNIGHT</text>
    <text x="81" y="108" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="3">CHANNEL</text>
    <text x="81" y="132" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">CH-04 ONLINE</text>

    <!-- TV Knobs -->
    <circle cx="174" cy="56" r="12" fill="#2E2E36" stroke="#FFE500" stroke-width="2" />
    <circle cx="174" cy="92" r="12" fill="#2E2E36" stroke="#FFE500" stroke-width="2" />
    <rect x="164" y="122" width="20" height="4" rx="2" fill="#FFE500" />
    <rect x="164" y="132" width="20" height="4" rx="2" fill="#FFE500" />
    <rect x="164" y="142" width="20" height="4" rx="2" fill="#FFE500" />

    <!-- TV Badge below -->
    <rect x="10" y="180" width="180" height="30" rx="6" fill="#FFE500" stroke="#000000" stroke-width="2" />
    <text x="100" y="201" fill="#000000" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">★ INVESTIGATION TEAM ★</text>
  </g>

  <!-- Content Right Side (Persona 4 Style Typography) -->
  <g transform="translate(520, 48)">
    <!-- Category Badge -->
    <g transform="rotate(-2)">
      <rect x="0" y="0" width="280" height="28" fill="#121214" rx="4" />
      <text x="14" y="19" fill="#FFE500" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" letter-spacing="2">PERSONA 4 // DEVELOPER DESK</text>
    </g>

    <!-- Hero Title: JADE AURESTHA (Angled Yellow Cutout Badges) -->
    <g transform="translate(0, 42)">
      <!-- Drop Shadow Box -->
      <polygon points="-5,8 575,-4 565,82 -15,94" fill="#000000" opacity="0.9" />
      <!-- Main White/Yellow Angled Box -->
      <polygon points="-8,4 570,-8 560,78 -18,90" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
      
      <!-- Inner text -->
      <text x="18" y="62" fill="#000000" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" font-style="italic" letter-spacing="3">JADE AURESTHA</text>
      <!-- Accent star -->
      <polygon points="525,18 531,34 548,34 534,44 539,60 525,50 511,60 516,44 502,34 519,34" fill="#FFD500" stroke="#000000" stroke-width="2" />
    </g>

    <!-- Subtitle Badge: KENKALAHOPEC -->
    <g transform="translate(4, 150) rotate(-1)">
      <rect x="0" y="0" width="310" height="34" fill="#000000" rx="4" />
      <text x="14" y="24" fill="#FFE500" font-family="'Arial Black', sans-serif" font-size="17" font-weight="900" letter-spacing="2">⚡ KENKALAHOPEC</text>
      <rect x="220" y="6" width="80" height="22" rx="3" fill="#FF3D00" />
      <text x="260" y="21" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" text-anchor="middle">LV. 99</text>
    </g>

    <!-- Slogan & Roles -->
    <g transform="translate(6, 202)">
      <text x="0" y="16" fill="#121214" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" letter-spacing="1">"REACH OUT TO THE TRUTH THROUGH CODE"</text>
      <text x="0" y="42" fill="#2A2A2E" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="14" font-weight="700">Fullstack Web Architect • Computer Vision &amp; AI Sorcerer • Udayana IT</text>
    </g>

    <!-- Decorative Persona 4 Tartot / Arcana Tags -->
    <g transform="translate(6, 260)">
      <rect x="0" y="0" width="130" height="22" rx="11" fill="#121214" />
      <text x="65" y="15" fill="#FFE500" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">ARCANA: THE FOOL</text>

      <rect x="140" y="0" width="130" height="22" rx="11" fill="#121214" />
      <text x="205" y="15" fill="#00E676" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">PERSONA: IZANAGI</text>

      <rect x="280" y="0" width="120" height="22" rx="11" fill="#121214" />
      <text x="340" y="15" fill="#00E5FF" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">LOCATION: BALI 🌴</text>
    </g>
  </g>

  <!-- Yellow Frame Border -->
  <rect x="0" y="0" width="1200" height="360" fill="none" stroke="#FFE500" stroke-width="6" />
</svg>